[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volc-alarms"
version = "1.0.0"
description = "Various volcano monitoring alarms."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Aaron Wech", email = "awech@usgs.gov"}]
license = {file = "LICENSE"}
dependencies = [
    "obspy",
    "pandas",
    "pyyaml",
    "jinja2",
    "cartopy",
    "cmcrameri",
    "matplotlib",
    "numba",
    "numpy",
    "python-dotenv",
    "utm",
    "scikit-learn",
    "requests",
    "scipy",
    "tabulate",
]
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["volcano", "geophysics", "monitoring"]

[project.optional-dependencies]
avo = [
    "beautifulsoup4",
    "enveloc",
    "pillow",
    "mattermostdriver",
    "openpyxl"
]
test = [
    "pytest>=7.0",
    "coverage",
    "tzdata",  # IANA tz DB so zoneinfo resolves US/Alaska on tzdata-less CI images
]
docs = [
    "mkdocs<2",
    "mkdocs-material",
    "mkdocstrings[python]",
    "ruff",  # mkdocstrings uses it to format rendered signatures
]

[project.scripts]
run-alarm = "volc_alarms.scripts.run_alarm:main"
get-rsam-levels = "volc_alarms.scripts.dr_to_rsam:main"
email-test = "volc_alarms.scripts.email_test:main"
generic-alarm = "volc_alarms.scripts.generic_alarm:main"
update-metadata = "volc_alarms.scripts.update_metadata:main"
update-html = "volc_alarms.scripts.notification_html:main"
list-alerts = "volc_alarms.scripts.list_alerts:main"

[tool.hatch.build.targets.wheel]
packages = ["src/volc_alarms"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast, isolated tests of a single function with local mocking only (no network, DB, email, or matplotlib rendering).",
    "integration: end-to-end tests that drive an alarm's run_alarm() through the shared fakes harness and compare against a frozen baseline.",
]
filterwarnings = [
    "ignore:.*:UserWarning:obspy.core.inventory.*",
]

[tool.coverage.run]
source = ["volc_alarms"]
omit = [
    "tests/*",
    "*/alarms/SO2/*",   # no recordable fixture: real SO2 alerts are rare + ephemeral
    "*/_vendor/*",      # vendored third-party code (e.g. lts_array)
]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
ignore = ["SIM114", "SIM102"]