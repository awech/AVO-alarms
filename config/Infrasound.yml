alarm_type: Infrasound        # designates which alarm module will be imported and executed
alarm_name: SDPI Infrasound   # alarm name sent to icinga and in message alerts

# Infrasound channels list
# Can be a simple list (metadata looked up from STATION_XML):
#   nslc:
#     - AV.SDPI.01.HDF
# Or a dict with manual per-channel metadata (no STATION_XML needed):
#   nslc:
#     AV.SDPI.01.HDF:
#       lat: 55.3456
#       lon: -161.8901
#       gain: 1.234e6
#     AV.SDPI.02.HDF
#       lat: ...
#       lon: ...
#       gain: ...

nslc:
  - AV.SDPI.01.HDF
  - AV.SDPI.02.HDF
  - AV.SDPI.03.HDF
  - AV.SDPI.04.HDF
  - AV.SDPI.05.HDF
  - AV.SDPI.06.HDF

# Processing parameters
f1: 1.0               # minimum frequency for bandpass filter
f2: 10.0              # maximum frequency for bandpass filter
# duration: 90         # Optional. Total window duration. Default: 90 s
# taper: 5.0           # Optional. Pre-filter taper. Default 5 s
# latency: 10.0        # Optional. Delay when run from cron for data latency. Default 10 s

# LTS array processing parameters (optional; fall back to env vars / defaults)
# lts_window_length: 30   # Optional. LTS window length (s).   Default: 30 (LTS_WINDOW_LENGTH)
# lts_overlap: 15         # Optional. LTS window overlap (s).  Default: 15 (LTS_OVERLAP)

# Detection parameters
min_chan: 3           # minimum number of channels for code to run

# Config-wide target defaults (optional). Apply to every target below unless
# the target overrides them. If unset, fall back to env vars / defaults.
# vmin: 0.28              # Optional. Min trace velocity (km/s).   Default: 0.28 (INFRASOUND_VMIN)
# vmax: 0.45              # Optional. Max trace velocity (km/s).   Default: 0.45 (INFRASOUND_VMAX)
# cmin: 0.6               # Optional. Min correlation to accept.   Default: 0.6  (INFRASOUND_CMIN)
# plot_duration: 10 * 60  # Optional. Array/local plot window (s). Default: 3600 (INFRASOUND_PLOT_DURATION)

# Alerting parameters
alert_memory: 3600     # lookback window (seconds)
max_alerts: 3          # max alerts within that window

# Infrasound target list:
# Required:
#   name, az_tolerance (degrees), min_pa (Pascals)
# Optional:
#   lat, lon
#   vmin, vmax, cmin, plot_duration: override the config-wide defaults above
#       for this target only. Precedence: target value > config-wide value >
#       env var > built-in default (0.28 / 0.45 / 0.6 / 3600).
#   back_azimuth: if known, manual target backazimuth can be given instead of lat/lon
#   local_nslc: is a list of local (to the target) seismic/infrasound channels 
#               to be plotted as spectrograms with array detection
#   traveltime: boolean to determine whether to calculate predicted airwave traveltime
#
# lat/lon info taken from target list file set as environment variable,
# if `name` not listed there, lat/lon must be included here.

targets:
  - name: Pavlof
    az_tolerance: 8
    min_pa: 2.0
    local_nslc:
      - AV.PV6A..BDF
      - AV.PV6A..SHZ
      - AV.PN7A..BHZ
      - AV.PS4A..BHZ
    plot_duration: 10 * 60 # in seconds

  - name: Veniaminof
    az_tolerance: 6
    min_pa: 0.5
    local_nslc:
      - AV.VNSG..BHZ
      - AV.VNWF..BHZ
      - AV.VNCG..BHZ
    plot_duration: 20 * 60 # in seconds

  - name: Aniakchak
    az_tolerance: 3
    min_pa: 0.3
    local_nslc:
      - AV.ANPK..BHZ
      - AV.ANNW..BHZ
      - AV.BPPC..BHZ
    plot_duration: 30 * 60 # in seconds

  - name: Shishaldin
    az_tolerance: 5
    min_pa: 0.5
    local_nslc:
      - AV.SSBA..BHZ
      - AV.ISNN..BHZ
      - AV.WTUG..BHZ
