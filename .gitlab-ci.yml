---
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip

stages:
  - test
  - deploy

# ---------------------------------------------------------------------------
# Main test + coverage (runs on the primary Python version)
# ---------------------------------------------------------------------------
test:
  image: 
    name: &primary_python python:3.14
    pull_policy: if-not-present
  stage: test
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[avo,test]"
  script:
    - coverage run -m pytest -ra
    - coverage report
    - coverage xml -i
    - coverage html
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/

# ---------------------------------------------------------------------------
# Multi-version compatibility (no coverage, just verify tests pass)
# ---------------------------------------------------------------------------
test-compat:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  image: 
    name: python:${PYTHON_VERSION}
    pull_policy: if-not-present
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[avo,test]"
  script:
    - pytest -ra

# ---------------------------------------------------------------------------
# Documentation site (GitLab Pages, built with MkDocs Material)
# ---------------------------------------------------------------------------
pages:
  image: 
    name: *primary_python
    pull_policy: if-not-present
  stage: deploy
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[avo,docs]"
  script:
    - mkdocs build --strict --site-dir public
    - mv htmlcov/ public/coverage
  artifacts:
    paths:
      - public
  only:
    - main
