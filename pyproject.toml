[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volc-alarms"
version = "0.1.0"
description = "Various volcano monitoring alarms."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Aaron Wech", email = "awech@usgs.gov"}]
license = {file = "LICENSE"}
dependencies = [
    "obspy",
    "pandas",
    "pyyaml",
    "jinja2",
    "cartopy",
    "cmcrameri",
    "matplotlib",
    "numba",
    "numpy",
    "python-dotenv",
    "utm",
    "scikit-learn",
    "requests",
    "scipy",
    "tabulate",
]
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["volcano", "geophysics", "monitoring"]

[project.optional-dependencies]
avo = [
    "beautifulsoup4",
    "enveloc",
    "pillow",
    "mattermostdriver",
    "openpyxl"
]

[project.scripts]
run-alarm = "volc_alarms.scripts.run_alarm:main"
email-test = "volc_alarms.scripts.email_test:main"
generic-alarm = "volc_alarms.scripts.generic_alarm:main"
update-metadata = "volc_alarms.scripts.update_metadata:main"
update-html = "volc_alarms.scripts.notification_html:main"
list-alerts = "volc_alarms.scripts.list_alerts:main"

[tool.hatch.build.targets.wheel]
packages = ["src/volc_alarms", "src/lts_array"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
